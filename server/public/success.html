<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Purchase Complete - SwimHub</title>
    <meta name="theme-color" content="#0a0a0b">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

        :root {
            --bg: #0a0a0b;
            --bg-elevated: #111113;
            --bg-card: rgba(17, 17, 19, 0.8);
            --text-primary: #fafafa;
            --text-secondary: #888;
            --text-muted: #555;
            --accent: #2563eb;
            --accent-hover: #3b82f6;
            --success: #10b981;
            --error: #ef4444;
            --border: rgba(255, 255, 255, 0.08);
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background: var(--bg);
            color: var(--text-primary);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
            -webkit-font-smoothing: antialiased;
        }

        .ambient {
            position: fixed;
            inset: 0;
            background: radial-gradient(ellipse 60% 40% at 50% 0%, rgba(16, 185, 129, 0.08), transparent);
            pointer-events: none;
        }

        .card {
            position: relative;
            z-index: 1;
            max-width: 420px;
            width: 100%;
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 20px;
            padding: 40px 32px;
            backdrop-filter: blur(20px);
            text-align: center;
            animation: fadeIn 0.5s cubic-bezier(0.16, 1, 0.3, 1);
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .icon {
            width: 64px;
            height: 64px;
            background: linear-gradient(135deg, var(--success), #059669);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 24px;
            font-size: 24px;
            color: white;
        }

        h1 {
            font-size: 24px;
            font-weight: 700;
            letter-spacing: -0.02em;
            margin-bottom: 8px;
        }

        .subtitle {
            color: var(--text-secondary);
            font-size: 15px;
            margin-bottom: 28px;
            line-height: 1.5;
        }

        .form-group {
            margin-bottom: 16px;
            text-align: left;
        }

        .form-label {
            display: block;
            color: var(--text-secondary);
            font-size: 13px;
            font-weight: 500;
            margin-bottom: 8px;
        }

        .form-input {
            width: 100%;
            padding: 14px 16px;
            background: var(--bg-elevated);
            border: 1px solid var(--border);
            border-radius: 10px;
            color: var(--text-primary);
            font-size: 15px;
            font-family: inherit;
            transition: border-color 0.2s;
        }

        .form-input:focus {
            outline: none;
            border-color: var(--accent);
        }

        .form-input::placeholder {
            color: var(--text-muted);
        }

        .btn {
            width: 100%;
            padding: 14px 24px;
            border-radius: 10px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            border: none;
            font-family: inherit;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .btn-primary {
            background: var(--accent);
            color: white;
        }

        .btn-primary:hover:not(:disabled) {
            background: var(--accent-hover);
            transform: translateY(-1px);
        }

        .btn-primary:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .hint {
            color: var(--text-muted);
            font-size: 12px;
            margin-top: 12px;
        }

        .message {
            padding: 12px 16px;
            border-radius: 10px;
            font-size: 14px;
            margin-bottom: 16px;
            display: none;
        }

        .message.error {
            background: rgba(239, 68, 68, 0.1);
            border: 1px solid rgba(239, 68, 68, 0.2);
            color: var(--error);
        }

        .message.info {
            background: rgba(37, 99, 235, 0.1);
            border: 1px solid rgba(37, 99, 235, 0.2);
            color: var(--accent);
        }

        .message.show { display: block; }

        .license-box {
            background: rgba(16, 185, 129, 0.08);
            border: 1px solid rgba(16, 185, 129, 0.2);
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 20px;
            display: none;
        }

        .license-box.show {
            display: block;
            animation: slideIn 0.4s cubic-bezier(0.16, 1, 0.3, 1);
        }

        @keyframes slideIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .license-label {
            color: var(--success);
            font-size: 14px;
            font-weight: 600;
            margin-bottom: 12px;
        }

        .license-key {
            background: var(--bg);
            border: 1px solid rgba(16, 185, 129, 0.15);
            border-radius: 8px;
            padding: 14px;
            font-family: 'SF Mono', Consolas, monospace;
            font-size: 15px;
            font-weight: 600;
            color: var(--success);
            word-break: break-all;
            margin-bottom: 12px;
        }

        .copy-btn {
            background: var(--success);
            color: white;
            border: none;
            border-radius: 8px;
            padding: 10px 18px;
            font-size: 13px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s;
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }

        .copy-btn:hover {
            transform: translateY(-1px);
        }

        .divider {
            display: flex;
            align-items: center;
            margin: 20px 0;
            color: var(--text-muted);
            font-size: 12px;
        }

        .divider::before, .divider::after {
            content: '';
            flex: 1;
            height: 1px;
            background: var(--border);
        }

        .divider span { padding: 0 12px; }

        .links {
            display: flex;
            gap: 10px;
            justify-content: center;
        }

        .link {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 10px 18px;
            background: var(--bg-elevated);
            border: 1px solid var(--border);
            border-radius: 8px;
            color: var(--text-secondary);
            text-decoration: none;
            font-size: 13px;
            font-weight: 500;
            transition: all 0.2s;
        }

        .link:hover {
            border-color: rgba(255, 255, 255, 0.15);
            color: var(--text-primary);
        }
    </style>
</head>
<body>
    <div class="ambient"></div>
    
    <div class="card">
        <div class="icon">
            <i class="fas fa-check"></i>
        </div>
        
        <h1>Payment Complete!</h1>
        <p class="subtitle">Enter the email you used during checkout to claim your license key.</p>

        <div class="message error" id="errorMsg">
            <i class="fas fa-exclamation-circle"></i>
            <span id="errorText"></span>
        </div>

        <div class="message info" id="infoMsg">
            <i class="fas fa-info-circle"></i>
            <span id="infoText"></span>
        </div>

        <div id="claimForm">
            <div class="form-group">
                <label class="form-label">Email Address</label>
                <input type="email" class="form-input" id="emailInput" placeholder="your@email.com" autocomplete="email">
            </div>
            <button class="btn btn-primary" id="claimBtn">
                <i class="fas fa-key"></i> Claim License Key
            </button>
            <p class="hint">Use the same email you entered during Polar checkout</p>
        </div>

        <div class="license-box" id="licenseBox">
            <div class="license-label">🎉 Your License Key</div>
            <div class="license-key" id="licenseKey"></div>
            <button class="copy-btn" id="copyBtn">
                <i class="fas fa-copy"></i> Copy
            </button>
        </div>

        <div class="divider"><span>or</span></div>

        <div class="links">
            <a href="https://dsc.gg/swimhub" target="_blank" class="link">
                <i class="fab fa-discord"></i> Support
            </a>
            <a href="/" class="link">
                <i class="fas fa-home"></i> Home
            </a>
        </div>
    </div>

    <script>
        const emailInput = document.getElementById('emailInput');
        const claimBtn = document.getElementById('claimBtn');
        const claimForm = document.getElementById('claimForm');
        const licenseBox = document.getElementById('licenseBox');
        const licenseKey = document.getElementById('licenseKey');
        const copyBtn = document.getElementById('copyBtn');
        const errorMsg = document.getElementById('errorMsg');
        const errorText = document.getElementById('errorText');
        const infoMsg = document.getElementById('infoMsg');
        const infoText = document.getElementById('infoText');

        // Get URL parameters
        const urlParams = new URLSearchParams(window.location.search);
        const sessionId = urlParams.get('session');
        const checkoutId = urlParams.get('checkout_id') || urlParams.get('checkoutId');

        // On page load: try to auto-fetch session info and pre-fill email
        document.addEventListener('DOMContentLoaded', async () => {
            // First, try checkout_id polling (if Polar redirected with checkout_id)
            if (checkoutId) {
                showInfo('Checking your payment status...');
                try {
                    const res = await fetch(`/api/claim-key?checkout_id=${encodeURIComponent(checkoutId)}`);
                    const data = await res.json();
                    if (data.status === 'ready' && data.key) {
                        showLicense(data.key);
                        return;
                    }
                } catch (err) {
                    console.log('Checkout ID lookup failed, falling back to email');
                }
            }

            // Second, try to get session info and pre-fill email
            if (sessionId) {
                try {
                    const res = await fetch(`/api/session/${sessionId}`);
                    if (res.ok) {
                        const session = await res.json();
                        if (session.email) {
                            emailInput.value = session.email;
                        }
                        // Check if license already delivered via session
                        const statusRes = await fetch(`/api/payment-status/${sessionId}`);
                        if (statusRes.ok) {
                            const status = await statusRes.json();
                            if (status.status === 'completed' && status.license_key) {
                                showLicense(status.license_key);
                                return;
                            }
                        }
                    }
                } catch (err) {
                    console.log('Session lookup failed');
                }
            }

            hideMessages();
        });

        claimBtn.addEventListener('click', async () => {
            const email = emailInput.value.trim().toLowerCase();
            
            if (!email || !email.includes('@')) {
                showError('Please enter a valid email address');
                return;
            }

            claimBtn.disabled = true;
            claimBtn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Claiming...';
            hideMessages();

            try {
                const res = await fetch('/api/claim-by-email', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email })
                });

                const data = await res.json();

                if (data.success && data.licenseKey) {
                    showLicense(data.licenseKey);
                } else if (data.status === 'pending') {
                    showInfo('Payment still processing. This may take up to 30 seconds. Please wait and try again.');
                } else if (data.status === 'not_found') {
                    showError('No purchase found for this email. Make sure you use the same email you entered during Polar checkout (not your Discord email).');
                } else if (data.status === 'no_stock') {
                    showError('License keys are temporarily out of stock. Please contact support and we will resolve this immediately.');
                } else {
                    showError(data.error || 'Failed to claim license. Contact support.');
                }
            } catch (err) {
                showError('Connection error. Please try again.');
            } finally {
                claimBtn.disabled = false;
                claimBtn.innerHTML = '<i class="fas fa-key"></i> Claim License Key';
            }
        });

        emailInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') claimBtn.click();
        });

        copyBtn.addEventListener('click', async () => {
            const key = licenseKey.textContent;
            try {
                await navigator.clipboard.writeText(key);
                copyBtn.innerHTML = '<i class="fas fa-check"></i> Copied!';
                setTimeout(() => {
                    copyBtn.innerHTML = '<i class="fas fa-copy"></i> Copy';
                }, 2000);
            } catch (err) {
                const ta = document.createElement('textarea');
                ta.value = key;
                document.body.appendChild(ta);
                ta.select();
                document.execCommand('copy');
                document.body.removeChild(ta);
                copyBtn.innerHTML = '<i class="fas fa-check"></i> Copied!';
                setTimeout(() => {
                    copyBtn.innerHTML = '<i class="fas fa-copy"></i> Copy';
                }, 2000);
            }
        });

        function showLicense(key) {
            claimForm.style.display = 'none';
            licenseKey.textContent = key;
            licenseBox.classList.add('show');
            document.querySelector('.subtitle').textContent = 'Your license key is ready!';
        }

        function showError(msg) {
            errorText.textContent = msg;
            errorMsg.classList.add('show');
            infoMsg.classList.remove('show');
        }

        function showInfo(msg) {
            infoText.textContent = msg;
            infoMsg.classList.add('show');
            errorMsg.classList.remove('show');
        }

        function hideMessages() {
            errorMsg.classList.remove('show');
            infoMsg.classList.remove('show');
        }
    </script>
</body>
</html>
